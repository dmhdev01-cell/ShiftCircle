spring:
  application:
    name: shiftcircle-api

server:
  port: 8081
  shutdown: graceful

sc:
  rules:
    # Published rule-set version the engine is running; replaced by the version table in step 11.
    version: v1
  build:
    git-commit: ${SC_GIT_COMMIT:unknown}
  demo:
    # The "today" the demo pretends it is: the UI clock and the schedule default to it.
    today: ${SC_DEMO_TODAY:2026-11-19}
  business-tz: ${SC_BUSINESS_TZ:America/Regina}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Readiness means "database reachable, migrations applied, rule set published", not just
        # "process started".
        readiness:
          include: readinessState,db,referenceData

logging:
  structured:
    format:
      console: ecs
  level:
    root: info
    ca.shiftcircle: info
