# Test-only values so the Spring context can start. Production images have no defaults:
# StartupSecrets refuses to start without POSTGRES_PASSWORD and SC_JWT_SECRET.
POSTGRES_PASSWORD=test-postgres-password
SC_JWT_SECRET=test-jwt-secret-that-is-at-least-32-bytes-long

# Spring's test cache keeps one context per property combination alive; with a dozen classes that
# is more than the database's 100 connections at Hikari's default of 10 each. Four is enough.
spring.datasource.hikari.maximum-pool-size=4
