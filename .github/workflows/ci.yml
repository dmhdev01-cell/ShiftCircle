# CI: pull requests and pushes to main only. No secrets are used.
# Actions are pinned by commit SHA (tag in the comment).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: repo check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./scripts/check-ignored-sources.sh
      - run: ./scripts/check-audit-codes.sh

  web:
    name: web (lint, tsc, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # pnpm version comes from "packageManager" in web/package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm test

  api:
    name: api (mvn verify, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # compose reads the whole .env file, so it must exist. Throwaway values, not secrets.
      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-throwaway-password-0001/; s/^SC_JWT_SECRET=.*/SC_JWT_SECRET=ci-throwaway-jwt-secret-000000000000000000000001/' .env
      # README §4 command (api-test: Docker build stage, mvn -B verify). On Linux,
      # host.docker.internal is not defined, so the override maps it to the host gateway.
      - name: mvn verify via compose api-test
        run: |
          cat > /tmp/compose.ci.yml <<'YML'
          services:
            api-test:
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YML
          docker compose -f docker-compose.yml -f /tmp/compose.ci.yml --profile test run --rm --build api-test

  e2e:
    # Playwright e2e needs a fresh stack per viewport (~minutes, README §4) and is not a
    # pull-request gate yet: manual only until it has been proven on a runner.
    name: e2e (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-throwaway-password-0001/; s/^SC_JWT_SECRET=.*/SC_JWT_SECRET=ci-throwaway-jwt-secret-000000000000000000000001/' .env
      - run: docker compose -p sc-test up -d --build --wait
      - run: docker run --rm -v "$PWD/e2e":/app -w /app node:24-alpine sh -c "corepack enable && pnpm install --frozen-lockfile"
      - run: >
          docker run --rm --add-host=host.docker.internal:host-gateway -v "$PWD/e2e":/work -w /work
          -e BASE_URL=http://host.docker.internal:8080
          mcr.microsoft.com/playwright:v1.65.1-noble npx playwright test --grep-invert @fixtures --project desktop
      - if: always()
        run: docker compose -p sc-test down -v
