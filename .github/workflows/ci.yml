# CI: pull requests and pushes to main only. No secrets are used.
# Actions are pinned by commit SHA (tag in the comment).
# Playwright e2e is NOT run here: it needs a fresh stack per viewport and a Linux-runner
# recipe that is still unverified (README §4 documents the local run). It is a follow-up.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: repo check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: ./scripts/check-ignored-sources.sh
      - run: ./scripts/check-audit-codes.sh
      # The dev override must keep db, api and web on loopback only (3 bindings).
      - name: Loopback port bindings
        run: |
          POSTGRES_PASSWORD=x SC_JWT_SECRET=y docker compose -f docker-compose.yml -f docker-compose.dev.yml config > /tmp/compose.out
          test "$(grep -c 'host_ip: 127.0.0.1' /tmp/compose.out)" -eq 3

  web:
    name: web (lint, tsc, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # pnpm version comes from "packageManager" in web/package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm build

  api:
    name: api (mvn verify, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Cache Maven repository
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.m2-ci
          key: m2-${{ hashFiles('api/**/pom.xml') }}
          restore-keys: m2-
      # compose reads the whole .env file, so it must exist. Throwaway values, not secrets.
      - name: Create throwaway .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-throwaway-password-0001/; s/^SC_JWT_SECRET=.*/SC_JWT_SECRET=ci-throwaway-jwt-secret-000000000000000000000001/' .env
      # README §4 command (api-test: Docker build stage, mvn -B verify). On Linux,
      # host.docker.internal is not defined, so the override maps it to the host gateway.
      - name: mvn verify via compose api-test
        run: |
          cat > /tmp/compose.ci.yml <<'YML'
          services:
            api-test:
              extra_hosts:
                - "host.docker.internal:host-gateway"
          YML
          docker compose -f docker-compose.yml -f /tmp/compose.ci.yml --profile test run --rm --build -v "$HOME/.m2-ci:/root/.m2" api-test
