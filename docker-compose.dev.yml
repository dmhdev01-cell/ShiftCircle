# Local debugging only: publishes the api and db ports to the host, on 127.0.0.1 only.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# The database host port is 5433 by default because a local PostgreSQL often owns 5432.
services:
  db:
    ports:
      - "127.0.0.1:${SC_DB_PORT:-5433}:5432"
  api:
    ports:
      - "127.0.0.1:${SC_API_PORT:-8081}:8081"
