# ShiftCircle web container (docs/08-deployment.md §6).
#
# Serves the React build and reverse-proxies /api/ to the api container, so
# the browser only ever talks to one origin and there is no CORS setup.
#
# This file is installed as /etc/nginx/conf.d/default.conf, so it sits inside
# the http context and map and resolver blocks are allowed here.

# Keep the caller's correlation id when there is one, otherwise mint one.
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

# Docker's embedded DNS. The api address is looked up per request instead of
# once at start up, so the web container starts even when the api is not up
# yet, and it finds the api again after the api container is recreated with a
# new address. This resolver only exists inside a Docker network.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. They are declared once at the server level so every
    # location inherits them - nginx drops inherited add_header rules as soon
    # as a location declares one of its own, so the locations below use the
    # `expires` directive instead of add_header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed file names, so these can be cached for a long time.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html must not be cached, or a new build never reaches the browser.
    location = /index.html {
        expires -1;
    }

    # The api. /actuator is deliberately not proxied.
    location /api/ {
        set $api_origin "http://api:8081";
        # $request_uri keeps the /api/ prefix and the query string, which is
        # what the api routes expect.
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Generate a quarter draft (POST /api/v1/planner/drafts): every proposed shift goes through the
    # rules engine, which takes seconds on a quiet host but can approach a minute on a cold, loaded
    # one. Same proxying as /api/ with a longer read timeout, for this one route only.
    location = /api/v1/planner/drafts {
        set $api_origin "http://api:8081";
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Correlation-Id $correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location /actuator {
        return 404;
    }

    # Container health check. It answers without touching the api, so the
    # web container stays healthy while the api is restarting.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
